[project]
name = "auto-safety-assist"
version = "0.1.0"
description = "Ask your car what's wrong. It answers with citations using NHTSA recalls and complaints, no guessing."
readme = "README.md"

requires-python = ">=3.11"

author = ["Shashank Agarwal"]
author-email = ["shashankag14@gmail.com"]

dependencies = [
    "fastapi>=0.141.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
]
intent-classifier = ["openai>=2.52.0"]
response-generator = ["openai>=2.52.0"]
retriever = [
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "psycopg2>=2.9.12",
    "sentence-transformers>=5.6.1",
]